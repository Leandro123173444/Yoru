name: YORU APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install SDK / NDK / CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1" 2>&1 | tee sdk.log

      - name: Build debug APK
        run: |
          set -o pipefail
          bash ./gradlew --no-daemon --stacktrace -Pkotlin.compiler.execution.strategy=in-process "-Dorg.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8" :app:assembleDebug 2>&1 | tee build.log

      - name: Mostrar errores
        if: failure()
        run: |
          {
            echo "### Errores del build"
            echo "~~~"
            grep -n -E "error:|FAILED|What went wrong|Execution failed" -A6 build.log 2>/dev/null | head -60
            echo "~~~"
            echo "### Ultimas lineas"
            echo "~~~"
            tail -30 build.log 2>/dev/null || tail -30 sdk.log
            echo "~~~"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: YORU-debug-apk
          path: app/build/outputs/apk/debug/*.apk
